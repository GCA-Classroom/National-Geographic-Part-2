<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The signature yellow frame, in the spirit of the magazine's cover border -->
  <div class="frame">

    <header class="masthead">
      <p class="eyebrow">FIELD GUIDE &middot; VOL. 02</p>
      <h1 class="title">COUNTRY EXPLORER</h1>
      <p class="subtitle">Dispatch reports from anywhere on Earth</p>
    </header>

    <main>
      <!-- SEARCH (from Part 1) -->
      <section class="search-panel" aria-label="Search for a country">
        <label for="countryInput" class="search-label">Enter a country name</label>
        <div class="search-row">
          <input
            type="text"
            id="countryInput"
            placeholder="e.g. Kenya, Japan, Peru..."
            autocomplete="off"
          >
          <button id="searchBtn" type="button">Explore</button>
        </div>
      </section>

      <!-- LOADING STATE (from Part 1) -->
      <div id="loading" class="loading hidden">
        <span class="compass" aria-hidden="true">&#9678;</span>
        <span>Charting course&hellip;</span>
      </div>

      <!-- ERROR STATE (from Part 1) -->
      <div id="errorMessage" class="error hidden" role="alert"></div>

      <!-- RESULT CARD (from Part 1) -->
      <section id="resultCard" class="result-card hidden" aria-live="polite">

        <img id="flagImg" class="flag" src="" alt="">

        <h2 id="countryName" class="country-name"></h2>

        <dl class="stat-grid">
          <div class="stat">
            <dt>Capital</dt>
            <dd id="capitalValue">&mdash;</dd>
          </div>
          <div class="stat">
            <dt>Region</dt>
            <dd id="regionValue">&mdash;</dd>
          </div>
          <div class="stat">
            <dt>Population</dt>
            <dd id="populationValue">&mdash;</dd>
          </div>
        </dl>

        <div class="languages-block">
          <dt>Languages</dt>
          <dd id="languagesValue">&mdash;</dd>
        </div>

      </section>

      <!-- ======================================================
           NEW IN PART 2: THE AI FIELD GUIDE
           Hidden until a country has been explored.
           ====================================================== -->
      <section id="fieldGuide" class="field-guide hidden" aria-label="Ask the AI Field Guide">

        <p class="guide-eyebrow">AI FIELD GUIDE</p>
        <h3 class="guide-title">Ask about <span id="guideCountryName">this country</span></h3>

        <!-- STRETCH (Step 9): suggested questions -->
        <div id="suggestions" class="suggestions" aria-label="Suggested questions">
          <button type="button" class="chip" data-question="What is a traditional dish here?">Food</button>
          <button type="button" class="chip" data-question="What wildlife lives here?">Wildlife</button>
          <button type="button" class="chip" data-question="What is a famous landmark to visit?">Landmarks</button>
          <button type="button" class="chip" data-question="What is a festival or celebration people enjoy here?">Festivals</button>
        </div>

        <!-- STRETCH (Step 10): conversation log for chat bubbles -->
        <div id="chatLog" class="chat-log" aria-live="polite"></div>

        <!-- CORE: the answer appears here -->
        <div id="guideResponse" class="guide-response" aria-live="polite">
          Your answer will appear here.
        </div>

        <label for="questionInput" class="search-label">Your question</label>
        <div class="search-row">
          <input
            type="text"
            id="questionInput"
            placeholder="e.g. What animals live here?"
            autocomplete="off"
          >
          <button id="askBtn" type="button">Ask the Field Guide</button>
        </div>

      </section>
    </main>

    <footer class="masthead-footer">
      <p>Data courtesy of the REST Countries API &middot; Answers generated by AI</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
